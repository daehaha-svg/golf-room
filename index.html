<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자동 연동 방 배정기</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; padding: 20px; color: #333; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #1a365d; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        label { display: block; font-weight: bold; margin-top: 15px; margin-bottom: 5px; color: #4a5568; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 15px; font-family: inherit; }
        button { width: 100%; padding: 15px; margin-top: 20px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .btn-primary { background-color: #1a365d; color: white; }
        .btn-ladder { background-color: #d97706; color: white; font-size: 18px; }
        .btn-secondary { background-color: #718096; color: white; margin-top: 10px; }
        
        .loading { text-align: center; color: #666; font-size: 14px; padding: 20px; font-weight: bold; }
        
        /* 토글 스위치 및 명단 스타일 */
        .player-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #edf2f7; transition: opacity 0.2s; }
        .player-item.excluded { opacity: 0.4; background-color: #f8fafc; }
        .player-item.excluded .player-name { text-decoration: line-through; color: #a0aec0; }
        
        .player-info { display: flex; align-items: center; gap: 10px; flex: 1; }
        .player-name { font-weight: bold; font-size: 16px; transition: color 0.2s; }
        .player-select { width: 130px; margin: 0; padding: 8px; font-size: 14px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; }
        
        /* 체크박스 스타일링 */
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: #1a365d; cursor: pointer; }

        .room-box { background-color: #ebf8ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .room-title { font-weight: 900; color: #2b6cb0; margin-bottom: 8px; font-size: 18px; border-bottom: 1px dashed #90cdf4; padding-bottom: 8px; }
        .room-members { font-weight: bold; color: #1a365d; font-size: 16px; line-height: 1.5; word-break: keep-all; }
        .help-text { font-size: 13px; color: #718096; text-align: center; margin-bottom: 15px; line-height: 1.4; background: #f8fafc; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div id="loadingMsg" class="card loading">구글 시트에서 명단을 불러오는 중입니다...</div>

    <div class="card" id="step1" style="display: none;">
        <h2>🏠 자동 연동 방 배정기</h2>
        
        <label>📅 경기 날짜 선택</label>
        <select id="dateSelect"></select>
        
        <label>🚪 사용할 방 번호 (쉼표로 구분)</label>
        <div style="font-size: 12px; color: #718096; margin-bottom: 8px;">예: 1, 2, 5 또는 VIP룸, 3번방</div>
        <input type="text" id="roomNames" value="1, 2, 3" placeholder="예: 1, 2, 3">
        
        <button class="btn-primary" onclick="goToStep2()">명단 확인 및 배정 설정 ➔</button>
    </div>

    <div class="card" id="step2" style="display: none;">
        <h2>🎯 배정 설정</h2>
        <div class="help-text">
            체크 해제 시 배정에서 <b>제외</b>됩니다.<br>
            특정 방에 고정할 사람은 방 번호를 선택하세요.
        </div>
        
        <div id="playerSetupList"></div>
        
        <button class="btn-ladder" onclick="runLadder()">🎲 사다리 타기 실행!</button>
        <button class="btn-secondary" onclick="location.reload()">처음으로 돌아가기</button>
    </div>

    <div class="card" id="step3" style="display: none;">
        <h2>🎉 방 배정 완료!</h2>
        
        <div id="resultBox"></div>
        
        <button class="btn-primary" onclick="resetToStep2()">🔙 멤버 그대로 다시 사다리 타기</button>
        <button class="btn-secondary" onclick="location.reload()">처음부터 다시</button>
    </div>
</div>

<script>
    // ★ 본인의 구글 시트 웹게시 링크 (랭킹 앱과 동일)
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQPc5vmxIbF91Tq-sHJU0OAm52uM5gezsNv2iUyU_776aEwnZjYakpbhn8hHl696Q19EiD8CD0xvPYu/pub?output=csv';

    let allRecords = [];
    let availableDates = [];
    let playersForDate = [];
    let rooms = [];

    // 구글 시트에서 데이터 불러오기
    async function fetchData() {
        try {
            const response = await fetch(CSV_URL);
            const csvText = await response.text();
            parseCSV(csvText);
            
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
            
            populateDates();
        } catch (error) {
            document.getElementById('loadingMsg').innerText = '데이터를 불러오는데 실패했습니다.';
            console.error(error);
        }
    }

    // CSV 파싱 로직 (이름과 날짜만 추출)
    function parseCSV(csvText) {
        const lines = csvText.split('\n');
        allRecords = [];
        
        if (lines.length < 2) return;

        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
        let dateIdx = headers.findIndex(h => h.includes('날짜'));
        let nameIdx = headers.findIndex(h => h.includes('이름'));

        // 헤더를 못 찾은 경우 기본 위치
        if (dateIdx === -1 || nameIdx === -1) {
            dateIdx = headers[0].includes('타임스탬프') ? 1 : 0;
            nameIdx = headers[0].includes('타임스탬프') ? 2 : 1;
        }

        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            const cols = line.split(',');
            if (cols.length > Math.max(dateIdx, nameIdx)) {
                let date = cols[dateIdx].trim().replace(/\.\s+/g, '-').replace(/\./g, '');
                let name = cols[nameIdx].trim();
                
                if (date && name) {
                    allRecords.push({ date: date, name: name });
                }
            }
        }
        
        // 고유 날짜 추출 후 최신순 정렬
        availableDates = [...new Set(allRecords.map(r => r.date))].sort().reverse();
    }

    // 날짜 드롭다운 채우기
    function populateDates() {
        const select = document.getElementById('dateSelect');
        availableDates.forEach(date => {
            const option = document.createElement('option');
            option.value = date;
            option.text = date + ' 경기';
            select.add(option);
        });
    }

    // 1단계 -> 2단계로 넘어갈 때 UI 생성
    function goToStep2() {
        const selectedDate = document.getElementById('dateSelect').value;
        const roomText = document.getElementById('roomNames').value;
        const roomNameList = roomText.split(/[\n,]+/).map(r => r.trim()).filter(r => r !== '');

        if (roomNameList.length === 0) {
            alert('사용할 방 번호를 입력해주세요!');
            return;
        }

        // 선택한 날짜의 멤버만 필터링 (중복 제거)
        const rawPlayers = allRecords.filter(r => r.date === selectedDate).map(r => r.name);
        playersForDate = [...new Set(rawPlayers)];

        if (playersForDate.length === 0) {
            alert('해당 날짜에 등록된 명단이 없습니다. 시트를 확인해주세요.');
            return;
        }

        // 방 목록 세팅
        rooms = [];
        roomNameList.forEach((name, idx) => {
            let displayName = isNaN(name) ? name : `${name}번 방`;
            rooms.push({ id: `room_${idx}`, name: displayName });
        });

        // 2단계 명단 UI 그리기
        let html = '';
        playersForDate.forEach((player, idx) => {
            html += `
            <div class="player-item" id="item_${idx}">
                <div class="player-info">
                    <input type="checkbox" id="chk_${idx}" checked onchange="togglePlayer(${idx})">
                    <span class="player-name">👤 ${player}</span>
                </div>
                <select class="player-select" id="assign_${idx}">
                    <option value="random">🎲 랜덤</option>`;
            rooms.forEach(r => {
                html += `<option value="${r.id}">${r.name}</option>`;
            });
            html += `</select></div>`;
        });

        document.getElementById('playerSetupList').innerHTML = html;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    }

    // 체크박스 클릭 시 스타일 회색 처리
    function togglePlayer(idx) {
        const isChecked = document.getElementById(`chk_${idx}`).checked;
        const itemDiv = document.getElementById(`item_${idx}`);
        const selectBox = document.getElementById(`assign_${idx}`);
        
        if (isChecked) {
            itemDiv.classList.remove('excluded');
            selectBox.disabled = false;
        } else {
            itemDiv.classList.add('excluded');
            selectBox.disabled = true;
        }
    }

    // 사다리 로직 실행
    function runLadder() {
        // 참여할 사람만 골라내기
        let activePlayers = [];
        playersForDate.forEach((player, idx) => {
            if (document.getElementById(`chk_${idx}`).checked) {
                activePlayers.push({
                    name: player,
                    assign: document.getElementById(`assign_${idx}`).value
                });
            }
        });

        if (activePlayers.length === 0) {
            alert('배정할 인원이 한 명도 없습니다!');
            return;
        }

        // 기본 2명씩, 남는 인원 분배를 위한 수학적 방 정원 계산
        let roomSlots = {};
        let roomOccupants = {};
        
        let baseCap = Math.floor(activePlayers.length / rooms.length);
        let remainder = activePlayers.length % rooms.length;

        // 인원이 너무 적으면 경고 없이 진행, 인원이 많으면(3명 이상) 안내
        if (baseCap >= 3 || (baseCap === 2 && remainder > 0)) {
            console.log("일부 방에 3명 이상이 배정됩니다.");
        }

        rooms.forEach((r, idx) => {
            // 나머지는 앞 방부터 1자리씩 더 채워줌 (가장 균등한 분배)
            roomSlots[r.id] = baseCap + (idx < remainder ? 1 : 0);
            roomOccupants[r.id] = [];
        });

        let randomPool = [];

        // 1. 수동 지정된 사람 먼저 넣기
        for (let i = 0; i < activePlayers.length; i++) {
            const p = activePlayers[i];
            if (p.assign !== 'random') {
                roomOccupants[p.assign].push(p.name);
                roomSlots[p.assign]--;
            } else {
                randomPool.push(p.name);
            }
        }

        // 유효성 검사 (수동으로 너무 많이 넣은 경우)
        for (let rId in roomSlots) {
            if (roomSlots[rId] < 0) {
                const overRoom = rooms.find(r => r.id === rId);
                alert(`[${overRoom.name}]에 지정된 인원이 너무 많습니다. 수동 배정을 줄여주세요!`);
                return;
            }
        }

        // 2. 빈자리(Slot) 모으기
        let availableSlots = [];
        for (let rId in roomSlots) {
            for (let i = 0; i < roomSlots[rId]; i++) {
                availableSlots.push(rId);
            }
        }

        // 빈자리 셔플
        for (let i = availableSlots.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [availableSlots[i], availableSlots[j]] = [availableSlots[j], availableSlots[i]];
        }

        // 사다리 명단 셔플
        for (let i = randomPool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [randomPool[i], randomPool[j]] = [randomPool[j], randomPool[i]];
        }

        // 3. 배정
        randomPool.forEach((player, idx) => {
            const targetRoomId = availableSlots[idx];
            roomOccupants[targetRoomId].push(player);
        });

        // 4. 결과 출력
        let resultHtml = '';
        rooms.forEach(r => {
            const playersInRoom = roomOccupants[r.id];
            // 해당 방에 인원이 0명인 경우 숨길지 여부 (일단 다 보여줌)
            resultHtml += `
                <div class="room-box">
                    <div class="room-title">🚪 ${r.name} <span style="font-size:14px; color:#4a5568; font-weight:normal;">(${playersInRoom.length}명)</span></div>
                    <div class="room-members">${playersInRoom.length > 0 ? playersInRoom.join(' / ') : '<span style="color:#a0aec0;font-size:14px;">빈 방</span>'}</div>
                </div>
            `;
        });

        document.getElementById('resultBox').innerHTML = resultHtml;
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
    }

    function resetToStep2() {
        document.getElementById('step3').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    }

    // 앱 시작
    fetchData();
</script>

</body>
</html>
